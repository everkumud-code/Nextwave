name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: nextwave-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nextwave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d nextwave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nextwave
      - run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nextwave
      - run: npm run typecheck
      - run: npm run qr:typecheck
      - run: npm run qr:build
      - run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nextwave
      - run: npm run lint
      - run: npm run build

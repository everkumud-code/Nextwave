name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/nextwave
      - run: npm run typecheck
      - run: npm run qr:typecheck
      - run: npm run qr:build
      - run: npm test
      - run: npm run lint
      - run: npm run build
